name: Publish docs site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm install

      - name: Build
        working-directory: website
        env:
          VITE_BASE: /Vincul/
        run: npm run build

      - name: Stage docs/
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir docs
          cp -r website/dist/* docs/
          # Ensure images exist even if Vite public copy is incomplete
          mkdir -p docs/images
          if [ -d website/public/images ]; then
            cp -n website/public/images/*.jpg docs/images/ 2>/dev/null || true
          fi
          touch docs/.nojekyll
          touch .nojekyll

      - name: Commit and push docs/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish website build to docs/"
          file_pattern: "docs .nojekyll"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

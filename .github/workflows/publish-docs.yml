name: Publish docs site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      # Ignore root pages artifact churn so the publish commit does not re-trigger
      - "index.html"
      - "assets/**"
      - "images/**"
      - "favicon.svg"
      - "icons.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm install

      - name: Build
        working-directory: website
        env:
          VITE_BASE: /Vincul/
        run: npm run build

      - name: Stage docs/ and root Pages artifacts
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir docs
          cp -r website/dist/* docs/
          touch docs/.nojekyll

          # Legacy Pages source is main "/" — also publish built site at repo root
          rm -rf assets
          cp website/dist/index.html ./index.html
          cp -r website/dist/assets ./assets
          mkdir -p images
          if [ -d website/dist/images ]; then
            cp -r website/dist/images/. images/
          elif [ -d website/public/images ]; then
            cp -r website/public/images/. images/
          fi
          cp website/dist/favicon.svg ./favicon.svg 2>/dev/null || true
          cp website/dist/icons.svg ./icons.svg 2>/dev/null || true
          touch .nojekyll

      - name: Commit and push docs/ + root Pages files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish website build to docs/ and Pages root"
          file_pattern: "docs .nojekyll index.html assets images favicon.svg icons.svg"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

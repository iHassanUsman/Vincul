name: Materialize site images

on:
  push:
    branches: [main]
    paths:
      - "website/public/images/.materialize-ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-images
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and decode JPEG payloads
        run: |
          set -euo pipefail
          cd website/public/images
          shopt -s nullglob
          for name in experience-bg how-bg systems hero medical logistics; do
            parts=(${name}.jpg.b64.p*)
            if [ ${#parts[@]} -eq 0 ]; then
              echo "missing parts for $name" >&2
              exit 1
            fi
            LC_ALL=C cat "${parts[@]}" > "${name}.jpg.b64"
            rm -f "${parts[@]}"
            base64 -d "${name}.jpg.b64" > "${name}.jpg"
            python3 -c "import pathlib; p=pathlib.Path('${name}.jpg'); b=p.read_bytes()[:3]; assert b==bytes([255,216,255]), b; print(p, 'ok', p.stat().st_size)"
            rm -f "${name}.jpg.b64"
          done
          rm -f .materialize-ready

      - name: Restore local asset() helper
        run: |
          printf '%s\n' \
            '/** Prefix public assets for GitHub Pages (or any non-root base). */' \
            'export function asset(path: string): string {' \
            "  const base = import.meta.env.BASE_URL || '/'" \
            "  const clean = path.replace(/^\\//, '')" \
            '  return `${base}${clean}`' \
            '}' \
            > website/src/base.ts

      - name: Update images README
        run: |
          printf '%s\n' \
            '# Images' \
            '' \
            'Compressed JPEG assets for the Vincul marketing site.' \
            > website/public/images/README.md

      - name: Cleanup probes
        run: rm -f website/public/images/_probe.jpg website/public/images/_probe2.jpg

      - name: Commit binary images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A website/public/images website/src/base.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Materialize compressed JPEGs from base64 part payloads"
          git push

name: Materialize site images

on:
  push:
    branches: [main]
    paths:
      - "website/public/images/.materialize-ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-images
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compressed JPEGs
        run: |
          set -euo pipefail
          cd website/public/images
          declare -A URLS=(
            [experience-bg]="https://n.uguu.se/gbuzLecu.jpg"
            [how-bg]="https://n.uguu.se/KOAccFzV.jpg"
            [systems]="https://h.uguu.se/BjKNUvQR.jpg"
            [hero]="https://d.uguu.se/fUWYySyM.jpg"
            [medical]="https://h.uguu.se/wZGbVivc.jpg"
            [logistics]="https://h.uguu.se/sKxYxugm.jpg"
          )
          for name in experience-bg how-bg systems hero medical logistics; do
            curl -fsSL --retry 3 --retry-delay 2 "${URLS[$name]}" -o "${name}.jpg"
            python3 -c "import pathlib; p=pathlib.Path('${name}.jpg'); b=p.read_bytes()[:3]; assert b==bytes([255,216,255]), b; print(p, 'ok', p.stat().st_size)"
          done

      - name: Restore local asset() helper
        run: |
          printf '%s\n' \
            '/** Prefix public assets for GitHub Pages (or any non-root base). */' \
            'export function asset(path: string): string {' \
            "  const base = import.meta.env.BASE_URL || '/'" \
            "  const clean = path.replace(/^\\//, '')" \
            '  return `${base}${clean}`' \
            '}' \
            > website/src/base.ts

      - name: Update images README
        run: |
          printf '%s\n' \
            '# Images' \
            '' \
            'Compressed JPEG assets for the Vincul marketing site.' \
            > website/public/images/README.md

      - name: Cleanup part payloads and probes
        run: |
          cd website/public/images
          rm -f .materialize-ready _probe.jpg _probe2.jpg .size-probe-*.txt
          rm -f *.jpg.b64.p* *.jpg.hex.p* *.jpg.b64

      - name: Commit binary images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A website/public/images website/src/base.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Materialize compressed JPEGs into website/public/images"
          git push
